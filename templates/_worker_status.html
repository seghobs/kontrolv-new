<link rel="stylesheet" href="{{ url_for('static', filename='css/worker_status.css') }}">
<aside class="worker-status" aria-label="İşçi durumu">
    <div class="worker-status-main">
        <div class="worker-status-heading">
            <span class="worker-status-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v5c0 5 4 8 8 10 4-2 8-5 8-10V6l-8-3Z"/><path d="m8 12 3 3 5-6"/></svg></span>
            <div class="worker-status-copy"><span class="worker-status-label">Denetim servisi</span><strong data-worker-state aria-live="polite">Durum kontrol ediliyor…</strong></div>
        </div>
        <div class="worker-status-details">
            <span class="worker-stat"><b data-worker-queued>—</b><span>Bekleyen</span></span>
            <span class="worker-stat"><b data-worker-running>—</b><span>Çalışan</span></span>
        </div>
    </div>
    <div class="worker-last-seen"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg><span>Son bağlantı</span><time data-worker-seen>—</time></div>
</aside>
<script defer src="{{ url_for('static', filename='js/worker_status.js') }}"></script>
